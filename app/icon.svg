<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Paperweight">
  <title>Paperweight</title>
  <!--
    A sheet with a folded corner and a weight sitting on it. Three shapes and
    no lettering, because this is read at 16 pixels in a browser tab more
    often than at any other size, and a fourth detail becomes a smudge there.
    The sheet stays white in both themes so the mark survives a dark tab strip.
  -->
  <path
    d="M8.5 3h10.6L25 8.9V27.5A1.5 1.5 0 0 1 23.5 29h-15A1.5 1.5 0 0 1 7 27.5v-23A1.5 1.5 0 0 1 8.5 3Z"
    fill="#ffffff" stroke="#18181b" stroke-width="2" stroke-linejoin="round" />
  <path d="M19.1 3 25 8.9h-5.9Z" fill="#e4e4e7" stroke="#18181b" stroke-width="2" stroke-linejoin="round" />
  <circle cx="20" cy="21.5" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
</svg>
